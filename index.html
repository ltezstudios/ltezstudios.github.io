<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ltezstudios - Under Construction</title>
  <link rel="canonical" href="https://lte-z.github.io/">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <style>
    :root {
      --background: #fafafa;
      --text: #242424;
      --muted: #686868;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 32px 24px;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 32rem;
      margin-block-end: 10vh;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 48px);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.2;
    }

    .status {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .description {
      margin: 28px 0 0;
    }

    .continue {
      margin: 24px 0 0;
    }

    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    a:focus-visible {
      border-radius: 2px;
      outline: 2px solid currentColor;
      outline-offset: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #161616;
        --text: #eeeeee;
        --muted: #a3a3a3;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>ltezstudios.github.io</h1>
    <p class="status">🚧 Under construction 🚧</p>
    <p class="description">You can visit lte_z's technical site.</p>
    <p class="continue"><a href="https://lte-z.github.io/">Continue to lte-z.github.io <span aria-hidden="true">→</span></a></p>
  </main>
</body>
</html>
